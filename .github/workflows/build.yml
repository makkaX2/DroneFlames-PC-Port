name: Automated Build & Release

on:
  push:
    branches: [ "master", "main", "test" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows PC Port
    runs-on: windows-latest

    steps:
      - name: Checkout Repository (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build Portable ZIP and Inno Setup Installer
        run: |
          python build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-ChildItem dist -Filter '*Setup*.exe')) { throw "Missing Windows installer" }

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS Universal Port
    runs-on: macos-latest

    steps:
      - name: Checkout Repository (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Godot 4.7.2 Headless & macOS Export Templates
        run: |
          mkdir -p godot_bin
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o godot_bin/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip
          unzip -q godot_bin/godot.zip -d godot_bin
          xattr -cr godot_bin/Godot.app || true
          chmod +x godot_bin/Godot.app/Contents/MacOS/Godot
          echo "$PWD/godot_bin/Godot.app/Contents/MacOS" >> $GITHUB_PATH

          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATES_DIR"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o godot_bin/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q godot_bin/templates.tpz -d godot_bin/templates_extracted
          cp -r godot_bin/templates_extracted/templates/* "$TEMPLATES_DIR/"

      - name: Export macOS Universal (.app)
        run: |
          mkdir -p dist build/macos
          VERSION=$(python3 -c "import build; print(build.VERSION)")
          Godot --headless --export-release "macOS" "build/macos/DroneFlames.zip"
          unzip -q build/macos/DroneFlames.zip -d dist/

          # Find whatever .app was extracted and normalize its name to DroneFlames.app
          EXTRACTED_APP=$(find dist -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found extracted macOS bundle: $EXTRACTED_APP"
          if [ -n "$EXTRACTED_APP" ] && [ "$EXTRACTED_APP" != "dist/DroneFlames.app" ]; then
            mv "$EXTRACTED_APP" dist/DroneFlames.app
          fi

          # Ad-hoc codesign and remove quarantine attributes
          codesign --force --deep -s - dist/DroneFlames.app
          xattr -cr dist/DroneFlames.app

          # Install dmgbuild for styled DMG creation
          python3 -m pip install dmgbuild

          # Create Styled DMG with standard drag-to-Applications installer
          DMG_NAME="DroneFlames_macOS_v${VERSION}_good_boy_irl.dmg"
          DMG_PATH="dist/${DMG_NAME}"
          python3 scripts/build_dmg.py --app dist/DroneFlames.app --output "$DMG_PATH"

          # Create Portable ZIP
          (cd dist && zip -r -q "DroneFlames_macOS_v${VERSION}_good_boy_irl.zip" "DroneFlames.app" && rm -rf "DroneFlames.app")

      - name: Upload macOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: |
            dist/*.dmg
            dist/*macOS*.zip
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

      - name: Accept Android SDK Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Godot 4.7.2 Headless & Export Templates
        run: |
          mkdir -p godot_bin
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o godot_bin/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot_bin/godot.zip -d godot_bin
          chmod +x godot_bin/Godot_v4.7.2-stable_linux.x86_64
          echo "$PWD/godot_bin" >> $GITHUB_PATH

          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o godot_bin/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q godot_bin/templates.tpz -d godot_bin/templates_extracted
          cp -r godot_bin/templates_extracted/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Export and verify signed Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.DRONEFLAMES_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.DRONEFLAMES_ANDROID_TEST_KEYSTORE_BASE64 }}
          ANDROID_TEST_KEY_PASSWORD: ${{ secrets.DRONEFLAMES_ANDROID_TEST_KEY_PASSWORD }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.DRONEFLAMES_ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.DRONEFLAMES_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist ~/.config/godot
          VERSION=$(python3 -c "import build; print(build.VERSION)")
          GODOT=./godot_bin/Godot_v4.7.2-stable_linux.x86_64
          APK="dist/DroneFlames_v${VERSION}_good_boy_irl.apk"
          cat > ~/.config/godot/editor_settings-4.tres << 'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          EOF
          if [[ "$VERSION" == *-test ]]; then
            ANDROID_KEYSTORE_BASE64="$ANDROID_TEST_KEYSTORE_BASE64"
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER=droneflames-test
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$ANDROID_TEST_KEY_PASSWORD"
          fi
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$GODOT_ANDROID_KEYSTORE_RELEASE_USER" || -z "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" ]]; then
            echo "::error::Android releases require a persistent signing key for their channel."
            exit 1
          fi
          umask 077
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/droneflames-release.keystore"
          trap 'rm -f "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          "$GODOT" --headless --export-release Android "$APK"
          apksigner verify "$APK"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    concurrency:
      group: droneflames-release-${{ (github.ref == 'refs/heads/test' || endsWith(github.ref, '-test')) && 'test' || 'stable' }}
      cancel-in-progress: false
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build-windows.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-android.result == 'success' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Port Version
        id: version_info
        run: |
          RAW_VER=$(python3 -c "import build; print(build.VERSION)")
          echo "RAW_VER=${RAW_VER}" >> $GITHUB_OUTPUT
          if [[ ! "$RAW_VER" =~ ^[0-9]+(\.[0-9]+){3}(-test)?$ ]]; then
            echo "::error::Invalid release version $RAW_VER"
            exit 1
          fi
          IS_TEST=false
          if [[ "$RAW_VER" == *-test ]]; then
            IS_TEST=true
          fi
          if [[ "$GITHUB_REF" == refs/heads/test && "$IS_TEST" != true ]] ||
             [[ "$GITHUB_REF" =~ ^refs/heads/(main|master)$ && "$IS_TEST" == true ]] ||
             [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$RAW_VER" ]]; then
            echo "::error::Git ref $GITHUB_REF does not match manifest version $RAW_VER"
            exit 1
          fi
          echo "IS_TEST=$IS_TEST" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=v$RAW_VER" >> "$GITHUB_OUTPUT"
          if [[ "$IS_TEST" == true ]]; then
            echo "RELEASE_TITLE=[TEST] DroneFlames v$RAW_VER (Experimental Build)" >> "$GITHUB_OUTPUT"
          else
            echo "RELEASE_TITLE=v$RAW_VER" >> "$GITHUB_OUTPUT"
          fi

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify release inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version_info.outputs.TAG_NAME }}
          VER: ${{ steps.version_info.outputs.RAW_VER }}
          IS_TEST: ${{ steps.version_info.outputs.IS_TEST }}
        run: |
          set -euo pipefail
          tag_refs=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          existing_commit=$(awk 'END { print $1 }' <<< "$tag_refs")
          if [[ -n "$existing_commit" && "$existing_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $TAG already points to a different commit"
            exit 1
          fi
          if [[ "$IS_TEST" != true ]]; then
            LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            python3 - "$TAG" "$LATEST" <<'PYTHON'
          import sys

          def version(tag):
              parts = tuple(map(int, tag.removeprefix("v").split(".")))
              return parts + (0,) * (4 - len(parts))

          tag, latest = sys.argv[1:]
          if tag != latest and version(tag) <= version(latest):
              sys.exit(f"Refusing to replace stable release {latest} with {tag}")
          PYTHON
          fi
          for asset in \
            "DroneFlames_PC_Setup_v${VER}_good_boy_irl.exe" \
            "DroneFlames_PC_v${VER}_droneflamesmod.zip" \
            "DroneFlames_macOS_v${VER}_good_boy_irl.dmg" \
            "DroneFlames_macOS_v${VER}_good_boy_irl.zip" \
            "DroneFlames_v${VER}_good_boy_irl.apk"; do
            if [[ ! -s "dist/$asset" ]]; then
              echo "::error::Missing release asset $asset"
              exit 1
            fi
          done

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          name: ${{ steps.version_info.outputs.RELEASE_TITLE }}
          make_latest: ${{ steps.version_info.outputs.IS_TEST != 'true' }}
          prerelease: ${{ steps.version_info.outputs.IS_TEST == 'true' }}
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.apk
          generate_release_notes: true
          body: |
            Сборка DroneFlames ${{ steps.version_info.outputs.TAG_NAME }} из коммита ${{ github.sha }}.
            Установщики и архивы для каждой платформы перечислены в Assets.
            Если Android отклоняет обновление из-за несовместимой подписи, экспортируйте сохранения перед переустановкой.

      - name: Verify stable update endpoint
        if: steps.version_info.outputs.IS_TEST != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version_info.outputs.TAG_NAME }}
        run: |
          for attempt in 1 2 3 4 5; do
            if [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" == "$TAG" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Legacy update endpoint did not return $TAG"
          exit 1

      - name: Send Notification to Telegram
        if: ${{ !contains(github.event.head_commit.message, '[skip notify]') }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TAG: "${{ steps.version_info.outputs.TAG_NAME }}"
          COMMIT_SHA: "${{ github.sha }}"
          RELEASE_REF: "${{ github.ref_name }}"
          IS_TEST: "${{ steps.version_info.outputs.IS_TEST }}"
        run: python3 scripts/notify_telegram.py
