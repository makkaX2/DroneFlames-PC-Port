name: Automated Build & Release

on:
  push:
    branches: [ "master", "main", "test" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows PC Port
    runs-on: windows-latest

    steps:
      - name: Checkout Repository (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build Portable ZIP and Inno Setup Installer
        run: |
          python build.py

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS Universal Port
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Godot 4.7.2 Headless & macOS Export Templates
        run: |
          mkdir -p godot_bin
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o godot_bin/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip
          unzip -q godot_bin/godot.zip -d godot_bin
          xattr -cr godot_bin/Godot.app || true
          chmod +x godot_bin/Godot.app/Contents/MacOS/Godot
          echo "$PWD/godot_bin/Godot.app/Contents/MacOS" >> $GITHUB_PATH

          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATES_DIR"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o godot_bin/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q godot_bin/templates.tpz -d godot_bin/templates_extracted
          cp -r godot_bin/templates_extracted/templates/* "$TEMPLATES_DIR/"

      - name: Export macOS Universal (.app)
        run: |
          mkdir -p dist build/macos
          VERSION=$(python3 -c "import build; print(build.VERSION)")
          Godot --headless --export-release "macOS" "build/macos/DroneFlames.zip"
          unzip -q build/macos/DroneFlames.zip -d dist/

          # Find whatever .app was extracted and normalize its name to DroneFlames.app
          EXTRACTED_APP=$(find dist -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found extracted macOS bundle: $EXTRACTED_APP"
          if [ -n "$EXTRACTED_APP" ] && [ "$EXTRACTED_APP" != "dist/DroneFlames.app" ]; then
            mv "$EXTRACTED_APP" dist/DroneFlames.app
          fi

          # Ad-hoc codesign and remove quarantine attributes
          codesign --force --deep -s - dist/DroneFlames.app
          xattr -cr dist/DroneFlames.app

          # Install dmgbuild for styled DMG creation
          python3 -m pip install dmgbuild

          # Create Styled DMG with standard drag-to-Applications installer
          DMG_NAME="DroneFlames_macOS_v${VERSION}_good_boy_irl.dmg"
          DMG_PATH="dist/${DMG_NAME}"
          python3 scripts/build_dmg.py --app dist/DroneFlames.app --output "$DMG_PATH"

          # Create Portable ZIP
          (cd dist && zip -r -q "DroneFlames_macOS_v${VERSION}_good_boy_irl.zip" "DroneFlames.app" && rm -rf "DroneFlames.app")

      - name: Upload macOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: |
            dist/*.dmg
            dist/*macOS*.zip
          if-no-files-found: ignore

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

      - name: Accept Android SDK Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Godot 4.7.2 Headless & Export Templates
        run: |
          mkdir -p godot_bin
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o godot_bin/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot_bin/godot.zip -d godot_bin
          chmod +x godot_bin/Godot_v4.7.2-stable_linux.x86_64
          echo "$PWD/godot_bin" >> $GITHUB_PATH

          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o godot_bin/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q godot_bin/templates.tpz -d godot_bin/templates_extracted
          cp -r godot_bin/templates_extracted/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Configure Godot Editor Settings for Android
        run: |
          mkdir -p ~/.config/godot
          cat << 'EOF' > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/debug_keystore = "${{ github.workspace }}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF

      - name: Export Android APK
        run: |
          mkdir -p dist
          VERSION=$(python3 -c "import build; print(build.VERSION)")
          ./godot_bin/Godot_v4.7.2-stable_linux.x86_64 --headless --export-debug "Android" "dist/DroneFlames_v${VERSION}_good_boy_irl.apk"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: dist/*.apk
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build-windows.result == 'success' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Port Version
        id: version_info
        run: |
          RAW_VER=$(python3 -c "import build; print(build.VERSION)")
          echo "RAW_VER=${RAW_VER}" >> $GITHUB_OUTPUT
          IS_TEST="false"
          if [[ "${{ github.ref }}" == "refs/heads/test" || "$RAW_VER" == *"test"* ]]; then
            IS_TEST="true"
          fi
          echo "IS_TEST=${IS_TEST}" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "RELEASE_TITLE=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [[ "$IS_TEST" == "true" ]]; then
            echo "TAG_NAME=v${RAW_VER}" >> $GITHUB_OUTPUT
            echo "RELEASE_TITLE=[TEST] DroneFlames v${RAW_VER} (Experimental Build)" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v${RAW_VER}" >> $GITHUB_OUTPUT
            echo "RELEASE_TITLE=v${RAW_VER}" >> $GITHUB_OUTPUT
          fi

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Display Release Files
        run: ls -la dist/

      - name: Clean Stale Mismatched Assets If Release Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version_info.outputs.TAG_NAME }}"
          VER="${{ steps.version_info.outputs.RAW_VER }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Checking existing assets for $TAG..."
            gh release view "$TAG" --json assets -q ".assets[].name" | while read -r asset; do
              if [[ -n "$asset" && "$asset" != *"$VER"* ]]; then
                echo "Deleting old/mismatched asset: $asset from $TAG"
                gh release delete-asset "$TAG" "$asset" -y || true
              fi
            done
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.TAG_NAME }}
          name: ${{ steps.version_info.outputs.RELEASE_TITLE }}
          make_latest: ${{ steps.version_info.outputs.IS_TEST != 'true' }}
          prerelease: ${{ steps.version_info.outputs.IS_TEST == 'true' }}
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.apk
          body: |
            ## 🎮 DroneFlames — PC Port by @droneflamesmod
            Релиз ПК-порта DroneFlames `${{ steps.version_info.outputs.TAG_NAME }}` (commit `${{ github.sha }}`).

            ### 📦 Файлы для загрузки:
            - **Windows Setup Installer:** `DroneFlames_PC_Setup_v${{ steps.version_info.outputs.RAW_VER }}_good_boy_irl.exe`
            - **Windows Portable (.ZIP):** `DroneFlames_PC_v${{ steps.version_info.outputs.RAW_VER }}_good_boy_irl.zip`
            - **macOS Universal (.DMG):** `DroneFlames_macOS_v${{ steps.version_info.outputs.RAW_VER }}_good_boy_irl.dmg`
            - **macOS Portable (.ZIP):** `DroneFlames_macOS_v${{ steps.version_info.outputs.RAW_VER }}_good_boy_irl.zip`
            - **Android APK:** `DroneFlames_v${{ steps.version_info.outputs.RAW_VER }}_good_boy_irl.apk`

            ---

            ### 🔥 Обновления и исправления ${{ steps.version_info.outputs.TAG_NAME }}:
            - **Исправление имён в лобби:** Устранено схлопывание никнеймов игроков в лобби сетевой игры; имена, стили и аватарки теперь отображаются корректно у всех участников комнаты.
            - **Навигация из профилей:** Исправлена кнопка «НАЗАД» при просмотре профилей игроков из лобби — теперь игрок возвращается обратно в свою комнату лобби, а не выбрасывается в таблицу лидеров.
            - **Полноценный сетевой мультиплеер & Авторизация:** Полное восстановление работы мультиплеера на выделенном сервере! Введена удобная система аккаунтов (логин и пароль), привязка всей косметики к учетной записи и безопасная синхронизация прогресса с облаком.
            - **Профили игроков & Инспектор:** Возможность открывать и детально просматривать профили других игроков в лобби и рейтингах (выбранная косметика, рамки, баннеры, аватарка, победы в соло/онлайне и общее игровое время).
            - **Кастомные аватарки:** Загрузка собственной аватарки из файлов (.PNG / .JPG) прямо в игре с мгновенным отображением в лобби, матчах и профиле игрока.
            - **Рейтинговые таблицы лидеров (Топы):** Глобальные таблицы лидеров по игровым часам, победам (учитываются победы соло и онлайн) и количеству сыгранных матчей. Топы предварительно наполнены реальной статистикой участников мультиплеера.
            - **Верификация разработчиков:** Официальные синие галочки верификации разработчиков порта в топах и профилях с информационным окном подтверждения подлинности. Защита эксклюзивной косметики разработчиков от несанкционированного выбора.
            - **Поддержка Linux:** Официальные универсальные скрипты установки (`install.sh`), запуска (`Start_DroneFlames.sh`) и полной интеграции в систему (.desktop ярлык, категории и эмблема для Arch, Ubuntu, Debian, Fedora, Hyprland, XFCE).
            - **Интерфейс & Видео:** Панель склада поднята вплотную к верхней полосе, разграничены клики по ресурсам (деньги -> доходы, энергия -> цепочки, склад -> склад, зелёная полоса -> страна); адаптивный полноэкранный фон трейлера без чёрных полос; пасхалка на сплэш-скрине.
            - **Верификация модов:** Официальные бейджи верификации для 6 модов, радужная кнопка модов в меню, включение модов по умолчанию.
            - **ОТРК «Искандер-М» & ВДВ v1.3.0 & Ядерный удар v1.2.0:** Интеграция ударов Искандера (ОФ и кассетные БЧ), мульти-штабы ВДВ (6 цветов), 5-фазная вспышка ядерного взрыва, ТОС-1А Солнцепёк с радиусом 90-640px.
            - **Быстрое строительство:** Живой предпросмотр постройки при зажатом Shift в реальном времени под курсором, непрерывное размещение по клику и мгновенное подтверждение по клавише E.
            - **Сетевой мультиплеер:** Исправлена ошибка проверки TLS сертификата релей-сервера (-9984), восстановлен доступ к сетевой игре.
            - **Оптимизация производительности:** Многоуровневая оптимизация, батчинг деревьев, отсечение чанков, авто-FPS и настройки графики.
            - **Горячие клавиши:** Клавиши B (казармы) и T (окопы), постройка без подтверждения по Shift, умный Esc.
            - **Нативная поддержка macOS (Universal Apple Silicon & Intel):** Полноценная третья поддерживаемая платформа! Сборка упакована в нативные DMG и Portable ZIP с поддержкой жестов трекпада macOS (pinch-to-zoom, панорамирование двумя пальцами) и сочетаний клавиш.
            - **Мультиплеер — позднее подключение и реконнект (Late Join):** Возможность подключаться к уже идущей партии, восстанавливать контроль над своей страной после вылета или брать управление над свободной страной ИИ.
            - **Мультиплеер — консенсусная скорость и защита от десинхронов:** Синхронизация скорости игры, устранение циклов рассинхронизации через паузу снапшотов и подтверждения (ACK).
            - **Оптимизация и безопасность модов:** Модификации временно скрыты с главного экрана для максимальной стабильности у обычных игроков; для моддеров и тестирования доступен переключатель в настройках.
            - **Умное сглаживание зума и совместимость с утилитами мыши macOS:** Полностью решена проблема резкого улёта камеры при использовании программ плавной прокрутки (Mos, Mac Mouse Fix, SmoothScroll, LinearMouse); добавлен учёт `factor` и адаптивное масштабирование частоты событий.
            - **Чёткая графика:** интерфейс и шрифты рисуются в разрешении окна без размытия из-за растяжения низкоразрешённого кадра.
            - **Окно целей ПВО:** сетка целей рассчитывается по ширине панели, поэтому элементы не раздвигают окно за край экрана.
            - **Сохранения:** стабильная папка пользовательских данных между версиями; сохранения и настройки копируются из старых папок без удаления исходных файлов.
            - **Мод сообщества:** добавлен оверлей FPS и измеренного сетевого ping; в одиночной игре ping не подменяется фиктивным числом.
            - **Хотфикс запуска:** исправлена ошибка компиляции меню, из-за которой игра показывала серый экран.
            - **Читаемость интерфейса:** на 4K автоматически выбирается масштаб 150%, на 5K и выше — 200%; доступен ручной выбор 80–200%.
            - **Настройка производительности:** выбор разрешения рендера с сохранением; варианты выше возможностей подключённого монитора скрыты.
            - **Система модов:** исправлены загрузка скачанных модов с собственными типами, безопасная замена установленной версии и обновление каталога после установки встроенного мода.
            - **Мод ПТРК:** урон и выбор целей используют боевую систему игры; союзники не получают урон от собственных ракет.
            - **Карточки модов:** устранено дублирование символа `@` в авторах.
            - **Исправление циклического обновления:** Устранена ошибка, из-за которой игра при запуске постоянно сообщала о наличии обновления, даже если уже установлена последняя версия.
            - **Динамическая сверка версий:** Модуль апдейтера теперь напрямую считывает актуальную установленную версию из манифеста игры, предотвращая ложные срабатывания.
            - **Сохранение в мультиплеере (Esc):** Добавлена кнопка «СОХРАНИТЬ» в паузе сетевой игры для моментального ручного сохранения партии хостом.
            - **Безопасный выход хоста:** Новая кнопка «СОХРАНИТЬ И ВЫЙТИ» в меню паузы — сохраняет партию и безопасно выходит в главное меню без удаления сохранения.
            - **Сохранение игроков по никнеймам и бесшовный реконнект:** Хост сохраняет всех игроков по их никнеймам. Вылетевшие игроки или друзья могут заново присоединиться к начатой/сохранённой игре и продолжить свой геймплей.
            - **Приглашение друзей и LAN IP в 1 клик:** Кнопка «ПРИГЛАСИТЬ» в меню паузы и плашка с IP адресом в лобби локальной сети с мгновенным копированием (поддержка локальной сети, Radmin VPN и Hamachi).
            - **Анонс возобновлённых партий:** При нажатии «Продолжить партию» локальный сервер автоматически объявляет себя в сети, и друзья видят комнату в списке серверов.
            - **Чистый заголовок окна:** Убрана надоедливая надпись `(DEBUG)` из заголовка окна, теперь там отображается версия: `DroneFlames v${{ steps.version_info.outputs.RAW_VER }} — PC Port by @droneflamesmod`.
            - **Официальная иконка игры:** Заменена стандартная иконка Godot — теперь везде отображается официальная эмблема игры (в таскбаре, окне, Alt-Tab и при полноэкранном режиме).

      - name: Send Notification to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TAG: "${{ steps.version_info.outputs.TAG_NAME }}"
          COMMIT_SHA: "${{ github.sha }}"
          RUN_ID: "${{ github.run_id }}"
          IS_TEST: "${{ steps.version_info.outputs.IS_TEST }}"
        run: python3 scripts/notify_telegram.py
