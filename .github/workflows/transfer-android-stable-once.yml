name: One-time encrypted Android signing transfer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    if: github.actor == 'makkaX2'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Encrypt existing stable signing data for the operator PC
        env:
          DF_KEYSTORE: ${{ secrets.DRONEFLAMES_ANDROID_KEYSTORE_BASE64 }}
          DF_PASSWORD: ${{ secrets.DRONEFLAMES_ANDROID_KEY_PASSWORD }}
          DF_ALIAS: ${{ secrets.DRONEFLAMES_ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/stable-signing.json" "$RUNNER_TEMP/stable.keystore"' EXIT
          cat > "$RUNNER_TEMP/recipient.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIID/DCCAmSgAwIBAgIULXfoq79TR929wgm3S0cAxb914UwwDQYJKoZIhvcNAQEL
          BQAwODE2MDQGA1UEAwwtRHJvbmVGbGFtZXMgb25lLXRpbWUgQW5kcm9pZCBzaWdu
          aW5nIHRyYW5zZmVyMB4XDTI2MTExNTA2MjcxNloXDTI2MTEyMjA2MzIxNlowODE2
          MDQGA1UEAwwtRHJvbmVGbGFtZXMgb25lLXRpbWUgQW5kcm9pZCBzaWduaW5nIHRy
          YW5zZmVyMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAuck16UY/vQJ/
          1KArZlmD2t2n6uQyWVExL9tz5fPqs1yl7D9CbAzJrpESYGbV+HE1cV7hQATTnjIU
          Fb4hleZUtxTYecpIo8c8Cv3isgXvgSNMAP4YcrkcS3rWxVi8yicpSEEWIPWOUHMZ
          b7dZUt8ZhMxR2lJy6FQkC7/oI766PWq3ZTVT74VCeymQJfgbN7CC0uoEOxjlwj0h
          ckwZPWbbjFV2/cfCOZn9AGT3VUsjruynb2ypGE6BST8x3hpnjp+XrzLUXxz/wBjW
          ieoZ7VZg/b5kq0W1pnRnQor4FujXVGVwXP79JmlEIyWJuHdUMeB2YgiB2ttjThhj
          xvxMH1XHv5iU0wmVytx+X9bVTKf41Ot38gOAVDcVYLe1CoZ9ohru4Bdtawt1D8Vc
          6vB/0qd9rMUDO9hr9gqOfSCI6uJbWR7ilAt+3G74KEthry9px5yoUeJQDcmuuK8W
          fe4WloRa219OA+gccaH5WdY+xsLpOebOkp5vBSNXLk+JzhTxSJXDAgMBAAEwDQYJ
          KoZIhvcNAQELBQADggGBAGpJmldYzvpcN6LtM8JeJlIaZsWEUqTpwYxhOZ7G3AOp
          SkBxE7gNWIA+OG1Vo1Juox6eGVqwsbyNrXTFOHiDjfjC+hz+b3SKqnTt7MgeLUha
          6M/OGZOxtt9bAcYs96cCQFhCjkAuFACkHi5nvwpu56nOkHqKaZ6uR04CWO6TtgUy
          cK3lV6kOAi6Crmkh878InysyygHWKXvBHJRFWDQPecPXm3OdH9Py8VtFRAZRLeXd
          /xtjJRor6rY9EILLoA9c4ac2Y9iAcVnB0BqG7bSqU87U37Gw0d+J0VpBPd8dbWj2
          5p1WoadQ8u8vPEhjDZ3aEm0bloEcYWVNnjQGQbPnzy46Ukm/ZrV//UFDOZeq/+rr
          hoVCdSh/2pwIuoY9abVk7vv7/trSctS0pxFTbazMjYg8z+hGZy9eDCBRC/h0qy8B
          TdaV3aZaTs7JHPzG1g8vbbROAwAtQHn3gZ4Q8Mp+dnt5aiIcFfzCMUSaYHfxrQ3C
          wpD/NjGefnT7927MJPBPBQ==
          -----END CERTIFICATE-----
          CERT
          python - <<'PY'
          import os,base64
          from pathlib import Path
          if any(not os.environ.get(k) for k in ('DF_KEYSTORE','DF_PASSWORD','DF_ALIAS')):raise SystemExit('Stable signing secrets are missing')
          (Path(os.environ['RUNNER_TEMP'])/'stable.keystore').write_bytes(base64.b64decode(os.environ['DF_KEYSTORE']))
          PY
          keytool -exportcert -keystore "$RUNNER_TEMP/stable.keystore" -storepass:env DF_PASSWORD -alias "$DF_ALIAS" -file "$RUNNER_TEMP/certificate.der"
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          data=dict(keystore=os.environ['DF_KEYSTORE'],password=os.environ['DF_PASSWORD'],alias=os.environ['DF_ALIAS'],certificate_sha256=hashlib.sha256((root/'certificate.der').read_bytes()).hexdigest())
          (root/'stable-signing.json').write_text(json.dumps(data))
          PY
          openssl cms -encrypt -binary -aes-256-gcm -recip "$RUNNER_TEMP/recipient.pem" -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/stable-signing.json" -outform DER -out "$RUNNER_TEMP/stable-signing.cms"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-stable-signing-encrypted
          path: ${{ runner.temp }}/stable-signing.cms
          retention-days: 1
          if-no-files-found: error
